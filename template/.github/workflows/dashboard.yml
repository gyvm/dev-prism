# PR dashboard for a consumer repo. Replace __OWNER__/__REPO__ with the engine
# repo you reference (e.g. your-org/dev-prism). See README for setup.
name: PR Dashboard

on:
  schedule:
    - cron: "0 0 * * 1" # weekly, Monday 00:00 UTC
  workflow_dispatch:
    inputs:
      from:
        description: "One-time backfill: collect history down to this date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write # commit the accumulating data/dwh
  pages: write
  id-token: write

concurrency:
  group: pr-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # 1. One step: collect PRs, refresh the committed DWH, and build the static
      #    dashboard into dist/. base must be "/<repo>/" for a Pages project page;
      #    use "/" for a custom domain or Cloudflare.
      - uses: __OWNER__/__REPO__@v0
        with:
          config: config.toml
          base: /${{ github.event.repository.name }}/
          from: ${{ github.event.inputs.from }}
          # Recommended for organizations: uncomment the GitHub App inputs below
          # and keep github-token commented out. The private key must be an
          # Actions secret; App ID and Installation ID can be Variables.
          # github-app-id: ${{ vars.DEV_PRISM_APP_ID }}
          # github-app-private-key: ${{ secrets.DEV_PRISM_APP_PRIVATE_KEY }}
          # github-app-installation-id: ${{ vars.DEV_PRISM_INSTALLATION_ID }}
          # For multiple organizations, use this instead of the singular ID:
          # github-app-installation-ids: |
          #   engineering=123456
          #   subsidiary=789012

          # PAT compatibility path. Keep this line active when using
          # DEV_PRISM_GH_TOKEN. When using GitHub App credentials, comment this
          # line out; if both paths are configured, PAT wins.
          github-token: ${{ secrets.DEV_PRISM_GH_TOKEN }}

      # 2. Persist the DWH so the next run resumes incrementally.
      - name: Commit DWH
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dwh
          if git diff --cached --quiet; then
            echo "No DWH changes to commit"
          else
            git commit -m "chore: refresh DWH ($(date -u +%Y-%m-%d))"
            git push
          fi

      # 3. Deploy dist/ to GitHub Pages.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
