# Cut a release: bump the version, push a vX.Y.Z tag, and move the floating
# major tag (v0). Run from Actions > Release > Run workflow and pick the bump
# type.
#
# Versioning (v0 line): minor = features/breaking, patch = fixes (semver's v0
# contract allows breaking changes in a minor). Consumers pin the floating
# `@v0`, so a release reaches them on their next run with no edit.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored for the very first release)"
        type: choice
        options: [patch, minor, major]
        default: minor

# Needs contents:write to push tags and the bump branch, pull-requests:write to
# open and merge the bump PR (main only accepts changes via PR — see below).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so we can read the latest tag and commit.
          fetch-depth: 0

      - name: Compute next version
        id: version
        # inputs.bump is a constrained choice (patch/minor/major) — safe to read.
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          if [ -z "$latest" ]; then
            # First release: publish package.json's current version as-is.
            next="$(node -p "require('./package.json').version")"
            echo "No prior release tag; first release at v$next"
          else
            cur="${latest#v}"
            major="${cur%%.*}"; rest="${cur#*.}"
            minor="${rest%%.*}"; patch="${rest##*.}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
            esac
            next="${major}.${minor}.${patch}"
            echo "Bumping ${cur} -> ${next} (${BUMP})"
          fi
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "Tag v${next} already exists; aborting." >&2
            exit 1
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "major=${next%%.*}" >> "$GITHUB_OUTPUT"

      - name: Bump, tag, and land the bump via PR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync package.json/package-lock to the release version.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          bumped=false
          if ! git diff --cached --quiet; then
            git commit -m "release: v${VERSION}"
            bumped=true
          fi

          # Immutable release tag + force-moved floating major tag, both on the
          # (possibly just-created) commit. Push tags first so the release lands
          # even if the branch reconciliation below fails.
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git tag -f -a "v${MAJOR}" -m "v${MAJOR} (floating: latest v${MAJOR}.x)"
          git push origin "refs/tags/v${VERSION}"
          git push -f origin "refs/tags/v${MAJOR}"

          # Advance the default branch with the bump commit. main only accepts
          # changes through a pull request (repository ruleset), so land the bump
          # via an auto-merged PR instead of a direct push. With 0 required
          # approvals and no required checks, GITHUB_TOKEN can merge it itself —
          # merging satisfies the "require a pull request" rule, so no bypass
          # actor is needed. If anything below fails, the tags above still
          # define the release.
          if [ "$bumped" != true ]; then
            echo "No version change to land on ${BRANCH}."
            exit 0
          fi

          head="release/v${VERSION}"
          # A non-default branch is outside the ruleset, so this push is allowed.
          git push -f origin "HEAD:refs/heads/${head}"

          gh pr create --base "${BRANCH}" --head "${head}" \
            --title "release: v${VERSION}" \
            --body "Automated version bump for v${VERSION}." || true

          # Merge commit keeps the tagged commit's SHA on ${BRANCH} (squash is
          # disabled for this repo). Mergeability is computed asynchronously, so
          # retry briefly before giving up.
          merged=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${head}" --merge --delete-branch; then
              merged=true
              break
            fi
            echo "Bump PR not mergeable yet (attempt ${attempt}); retrying..."
            sleep 5
          done
          if [ "$merged" != true ]; then
            echo "::warning::Could not merge the bump PR (${head}) into ${BRANCH}. Tags were pushed; the release is valid. Merge ${head} manually to sync package.json."
          fi
